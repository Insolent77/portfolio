<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Статистика · INS</title>
<style>
* { box-sizing:border-box } body { margin:0; background:#faf5ec; color:#211e1c; font:1rem/1.55 system-ui,sans-serif }
main { max-width:44rem; margin:8vh auto; padding:1.5rem } h1 { font:2.6rem Georgia,serif }
label,input { display:block } input,button { font:inherit; padding:.65rem 1rem; border:1px solid #81766b; border-radius:.5rem }
input { width:min(100%,25rem); margin:.25rem 0 1rem } button { background:#292622; color:white; cursor:pointer }
table { width:100%; border-collapse:collapse } th,td { padding:.45rem; text-align:left; border-bottom:1px solid #d2c9bd }
td:last-child,th:last-child { text-align:right } caption { text-align:left; font-weight:bold; margin:1rem 0 }
th[scope="rowgroup"] { text-align:left; padding-top:1.2rem; color:#50483f }
.exclude { display:inline-flex; align-items:center; gap:.45rem; margin-top:1rem }
.exclude input { width:auto; margin:0; accent-color:#167467 }
#metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr)); gap:.7rem }
#metrics article { background:#f5f9fa; border-radius:.6rem; padding:.85rem 1rem }
#metrics strong,#metrics small { display:block }
#metrics strong { font-size:1.35rem }
</style>
<link rel="stylesheet" href="chart.css?v=5">
<main>
<h1>Статистика портфолио</h1>
<form id="login" hidden>
<label>Электронная почта<input name="email" type="email" autocomplete="username" required></label>
<label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
<button>Войти</button>
</form>
<p role="status" id="status"></p>
<button type="button" id="logout" hidden>Выйти</button>
<section id="report" hidden>
<label class="exclude"><input type="checkbox" id="exclude-browser">Не учитывать этот браузер</label>
<section id="daily" aria-labelledby="chart-title">
<h2 id="chart-title">Посещаемость по дням</h2>
<form id="range-filter">
<label>От<input type="date" name="from" required></label>
<label>По<input type="date" name="to" required></label>
<button type="submit">Показать</button>
<button type="button" id="this-week">Текущая неделя</button>
</form>
<p id="period"></p>
<div id="metrics" aria-live="polite"></div>
<div class="legend"><span>Посетители</span><span>Нажатия</span></div>
<svg id="chart" viewBox="0 0 680 245" tabindex="0" role="group" aria-label="Дневная статистика. Для выбора дня используйте стрелки влево и вправо."></svg>
<div id="day-detail" aria-live="polite"></div>
<aside id="chart-popup" tabindex="0" aria-label="Нажатия по кнопкам за день" hidden></aside>
</section>
<h2>Уникальные браузеры · <span id="visitors"></span></h2>
<table><caption>За всё время</caption><thead><tr><th>Кнопка или ссылка</th><th>Нажатия</th></tr></thead>
<tbody id="primary-controls"></tbody><tbody id="other-controls"></tbody></table>
</section>
</main>
<script src="../analytics-config.js"></script>
<script src="supabase-2.119.2.js"></script>
<script src="chart.js?v=6"></script>
<script src="stats.js?v=7"></script>
</html>
